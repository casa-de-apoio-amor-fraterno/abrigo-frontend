@if (idEstadiaAberta() !== null) {
  <app-acao-dialog
    icone="event_available"
    [titulo]="ehAcompanhante() ? 'Finalizar acompanhante' : 'Finalizar estadia'"
    [subtitulo]="'Confirme os detalhes e informe a data de saída'"
    [descricao]="descricao()"
    [detalhes]="detalhes()"
    [erro]="erro()"
    [confirmando]="finalizando()"
    [textoConfirmar]="ehAcompanhante() ? 'Registrar saída' : 'Finalizar estadia'"
    (cancelar)="fechar()"
    (confirmar)="confirmar()"
  >
    <mat-form-field appearance="outline">
      <mat-label>Data/hora de saída</mat-label>
      <input
        matInput
        type="datetime-local"
        [value]="dataSaida()"
        (input)="alterarDataSaida($any($event.target).value)"
      />
    </mat-form-field>
  </app-acao-dialog>
}
