<div class="contatos">
  @if (carregando()) {
    <div class="contatos__estado">
      <mat-spinner diameter="32" />
    </div>
  } @else {
    <div class="contatos__cabecalho">
      <p class="contatos__subtitulo">Telefones de contato.</p>
      <button mat-flat-button type="button" class="contatos__novo" (click)="novoContato()">
        <mat-icon>add</mat-icon>
        Novo contato
      </button>
    </div>

    @if (erro()) {
      <p class="contatos__erro">{{ erro() }}</p>
    }

    @if (contatos().length === 0) {
      <p class="contatos__vazio">Nenhum contato cadastrado ainda.</p>
    } @else {
      <ul class="cadastro__lista contatos__lista">
        @for (contato of contatos(); track contato.id) {
          <li>
            <button type="button" class="contatos__cartao" (click)="editar(contato)">
              @if (contato.principal) {
                <span class="contatos__badge contatos__badge--canto">Principal</span>
              }
              <strong>
                {{ contato.numero }}
                @if (contato.observacao) {
                  <span class="contatos__aviso" [title]="contato.observacao">⚠</span>
                }
              </strong>
              <span>{{ contato.nomeContato || 'Quem atende não informado' }}</span>
            </button>
          </li>
        }
      </ul>
    }
  }
</div>
