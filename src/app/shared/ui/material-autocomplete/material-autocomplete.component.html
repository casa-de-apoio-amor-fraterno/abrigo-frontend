<mat-form-field appearance="outline" class="material-autocomplete">
  <mat-label>{{ label() }}</mat-label>
  <input matInput [formControl]="termo" [matAutocomplete]="auto" placeholder="Buscar por descrição..." />
  <mat-autocomplete #auto="matAutocomplete" (optionSelected)="selecionar($event)">
    @for (material of opcoes(); track material.id) {
      <mat-option [value]="material">{{ material.descricao }}</mat-option>
    }
  </mat-autocomplete>
</mat-form-field>
