<div class="cadastro" [style.max-width.px]="larguraMaxima()">
  <div class="cadastro__cabecalho">
    <a [routerLink]="voltarPara()" class="cadastro__voltar" aria-label="Voltar para a consulta">
      <mat-icon>arrow_back</mat-icon>
    </a>
    <div>
      <h1>{{ titulo() }}</h1>
      @if (subtitulo()) {
        <p class="cadastro__subtitulo">{{ subtitulo() }}</p>
      }
    </div>
  </div>

  @if (carregando()) {
    <div class="cadastro__estado">
      <mat-spinner diameter="32" />
    </div>
  } @else {
    <ng-content />
  }
</div>
