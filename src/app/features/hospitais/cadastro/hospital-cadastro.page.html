<form [formGroup]="form" (ngSubmit)="salvar()">
  <app-cadastro-dialog-shell
    [titulo]="modoEdicao ? 'Editar hospital' : 'Novo hospital'"
    subtitulo="Cadastro de hospitais/origens usados no atendimento."
    [carregando]="carregando()"
  >
    @if (modoEdicao && !ativo()) {
      <p class="cadastro__aviso">Este hospital está inativo — não aparece nas seleções de estadia/pessoa.</p>
    }

    <div class="cadastro__grade">
      <mat-form-field appearance="outline" class="cadastro__campo cadastro__campo--largo">
        <mat-label>Nome</mat-label>
        <input matInput formControlName="nome" />
        @if (form.controls.nome.touched && form.controls.nome.invalid) {
          <mat-error>Informe o nome</mat-error>
        }
      </mat-form-field>
    </div>

    @if (erro()) {
      <p class="cadastro__erro">{{ erro() }}</p>
    }

    <ng-container acoes>
      <app-cadastro-acoes voltarPara="/hospitais" [salvando]="salvando()">
        @if (modoEdicao && ativo()) {
          <button
            extra
            mat-button
            type="button"
            class="cadastro__acao-perigo"
            [disabled]="inativando()"
            (click)="inativar()"
          >
            Inativar
          </button>
        }
      </app-cadastro-acoes>
    </ng-container>
  </app-cadastro-dialog-shell>
</form>
