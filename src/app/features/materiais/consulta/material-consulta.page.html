<app-pagina-consulta
  titulo="Materiais"
  subtitulo="Consulta de materiais e equipamentos do Abrigo."
  [carregando]="carregando()"
  [erro]="erro()"
  [vazio]="itens().length === 0"
  mensagemVazio="Nenhum material encontrado."
  [total]="total()"
  [pagina]="pagina()"
  [itensPorPagina]="itensPorPagina"
  rotuloItem="material(is)"
  (paginaAnterior)="paginaAnterior()"
  (paginaProxima)="proximaPagina()"
>
  <ng-container acoes>
    <button mat-button type="button" [disabled]="exportando()" (click)="exportarCsv()">
      <mat-icon>download</mat-icon>
      Exportar CSV
    </button>
    <a mat-flat-button routerLink="/materiais/novo" class="consulta__nova-btn">
      <mat-icon>add</mat-icon>
      Novo material
    </a>
  </ng-container>

  <form filtros class="consulta__busca" (ngSubmit)="buscar()">
    <input
      type="search"
      placeholder="Buscar por descrição..."
      [value]="termoBusca()"
      (input)="termoBusca.set($any($event.target).value)"
    />
    <button mat-flat-button type="submit" class="consulta__busca-btn">Buscar</button>
  </form>

  <table class="consulta__tabela">
    <thead>
      <tr>
        <th>Descrição</th>
        <th>Situação</th>
        <th>Disponível p/ empréstimo</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (material of itens(); track material.id) {
        <tr>
          <td>{{ material.descricao }}</td>
          <td>{{ material.situacao }}</td>
          <td>{{ material.disponivelEmprestimo ? 'Sim' : 'Não' }}</td>
          <td class="consulta__coluna-acao">
            <a mat-icon-button [routerLink]="['/materiais', material.id, 'editar']" aria-label="Editar material">
              <mat-icon>edit</mat-icon>
            </a>
          </td>
        </tr>
      }
    </tbody>
  </table>
</app-pagina-consulta>
