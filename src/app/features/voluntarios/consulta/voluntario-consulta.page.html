<app-pagina-consulta
  titulo="Voluntários"
  subtitulo="Consulta de voluntários cadastrados no Abrigo."
  [carregando]="carregando()"
  [erro]="erro()"
  [vazio]="itens().length === 0"
  mensagemVazio="Nenhum voluntário encontrado."
  [total]="total()"
  [pagina]="pagina()"
  [itensPorPagina]="itensPorPagina"
  rotuloItem="voluntário(s)"
  (paginaAnterior)="paginaAnterior()"
  (paginaProxima)="proximaPagina()"
>
  <ng-container acoes>
    <button mat-button type="button" [disabled]="exportando()" (click)="exportarCsv()">
      <mat-icon>download</mat-icon>
      Exportar CSV
    </button>
    <a mat-flat-button routerLink="/voluntarios/novo" class="consulta__nova-btn">
      <mat-icon>add</mat-icon>
      Novo voluntário
    </a>
  </ng-container>

  <form filtros class="consulta__busca" (ngSubmit)="buscar()">
    <input
      type="search"
      placeholder="Buscar por nome ou CPF..."
      [value]="termoBusca()"
      (input)="termoBusca.set($any($event.target).value)"
    />
    <button mat-flat-button type="submit" class="consulta__busca-btn">Buscar</button>
  </form>

  <table class="consulta__tabela">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Telefone</th>
        <th>Setor</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (voluntario of itens(); track voluntario.id) {
        <tr>
          <td>{{ voluntario.nome }}</td>
          <td>{{ voluntario.telefone }}</td>
          <td>{{ voluntario.setor || '—' }}</td>
          <td class="consulta__coluna-acao">
            <a mat-icon-button [routerLink]="['/voluntarios', voluntario.id, 'editar']" aria-label="Editar voluntário">
              <mat-icon>edit</mat-icon>
            </a>
          </td>
        </tr>
      }
    </tbody>
  </table>
</app-pagina-consulta>
