<app-pagina-consulta
  titulo="Empréstimos"
  subtitulo="Consulta de empréstimos de materiais do Abrigo."
  [carregando]="carregando()"
  [erro]="erro()"
  [vazio]="itens().length === 0"
  mensagemVazio="Nenhum empréstimo encontrado."
  [total]="total()"
  [pagina]="pagina()"
  [itensPorPagina]="itensPorPagina"
  rotuloItem="empréstimo(s)"
  (paginaAnterior)="paginaAnterior()"
  (paginaProxima)="proximaPagina()"
>
  <ng-container acoes>
    <button mat-button type="button" class="consulta__exportar-btn" [disabled]="exportando()" (click)="exportarCsv()">
      <mat-icon>download</mat-icon>
      Exportar CSV
    </button>
    <a mat-flat-button routerLink="/emprestimos/novo" class="consulta__nova-btn">
      <mat-icon>add</mat-icon>
      Novo empréstimo
    </a>
  </ng-container>

  <app-filtro-pills filtros [opcoes]="opcoesSituacao" [valor]="situacao()" (mudanca)="filtrarPorSituacao($event)" />
  <form filtros class="consulta__busca consulta__busca--com-periodo" (ngSubmit)="buscar()">
    <input
      type="search"
      placeholder="Buscar por nome da pessoa..."
      [value]="termoBusca()"
      (input)="termoBusca.set($any($event.target).value)"
    />
    <div class="consulta__busca-periodo">
      <label class="consulta__busca-data">
        Devolução prevista de
        <input
          type="date"
          [value]="dataDevolucaoInicio()"
          (input)="dataDevolucaoInicio.set($any($event.target).value)"
        />
      </label>
      <label class="consulta__busca-data">
        até
        <input
          type="date"
          [value]="dataDevolucaoFim()"
          (input)="dataDevolucaoFim.set($any($event.target).value)"
        />
      </label>
    </div>
    <button mat-flat-button type="submit" class="consulta__busca-btn">Buscar</button>
  </form>

  <table class="consulta__tabela">
    <thead>
      <tr>
        <th>Pessoa</th>
        <th>Nº contrato</th>
        <th>Situação</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (emprestimo of itens(); track emprestimo.id) {
        <tr>
          <td class="consulta__coluna-principal">{{ nomesPessoas()[emprestimo.idPessoa] || '—' }}</td>
          <td>{{ emprestimo.numeroContrato || '—' }}</td>
          <td>
            <span class="consulta__badge" [class.consulta__badge--neutro]="emprestimo.situacao === 'Devolvido'">
              {{ emprestimo.situacao }}
            </span>
          </td>
          <td class="consulta__coluna-acao">
            <button
              mat-icon-button
              type="button"
              class="consulta__botao-visualizar"
              aria-label="Visualizar empréstimo"
              (click)="visualizar(emprestimo)"
            >
              <mat-icon>visibility</mat-icon>
            </button>
            <a
              mat-icon-button
              [routerLink]="['/emprestimos', emprestimo.id, 'editar']"
              class="consulta__botao-editar"
              aria-label="Editar empréstimo"
            >
              <mat-icon>edit</mat-icon>
            </a>
            <button
              mat-icon-button
              type="button"
              class="consulta__botao-contratos"
              aria-label="Ver contratos"
              (click)="verContratos(emprestimo)"
            >
              <mat-icon>description</mat-icon>
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</app-pagina-consulta>

<router-outlet></router-outlet>
