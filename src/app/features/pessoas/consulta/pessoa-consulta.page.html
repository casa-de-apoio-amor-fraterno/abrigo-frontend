<app-pagina-consulta
  titulo="Pessoas"
  subtitulo="Consulta de pessoas cadastradas no Abrigo."
  [carregando]="carregando()"
  [erro]="erro()"
  [vazio]="itens().length === 0"
  mensagemVazio="Nenhuma pessoa encontrada."
  [total]="total()"
  [pagina]="pagina()"
  [itensPorPagina]="itensPorPagina"
  rotuloItem="pessoa(s)"
  (paginaAnterior)="paginaAnterior()"
  (paginaProxima)="proximaPagina()"
>
  <ng-container acoes>
    <button mat-button type="button" [disabled]="exportando()" (click)="exportarCsv()">
      <mat-icon>download</mat-icon>
      Exportar CSV
    </button>
    <a mat-flat-button routerLink="/pessoas/novo" class="consulta__nova-btn">
      <mat-icon>add</mat-icon>
      Nova pessoa
    </a>
  </ng-container>

  <form filtros class="consulta__busca" (ngSubmit)="buscar()">
    <input
      type="search"
      placeholder="Buscar por nome ou CPF..."
      [value]="termoBusca()"
      (input)="termoBusca.set($any($event.target).value)"
    />
    <button mat-flat-button type="submit" class="consulta__busca-btn">Buscar</button>
  </form>

  <table class="consulta__tabela">
    <thead>
      <tr>
        <th>Nome</th>
        <th>
          CPF
          <mat-icon
            class="consulta__ajuda-cpf"
            matTooltip="CPF parcialmente oculto por exigência da LGPD — o número completo só é exibido na tela de edição da pessoa."
            aria-label="Por que o CPF está parcialmente oculto"
          >help_outline</mat-icon>
        </th>
        <th>Telefone</th>
        <th>Nascimento</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (pessoa of itens(); track pessoa.id) {
        <tr>
          <td>{{ pessoa.nome }}</td>
          <td>{{ pessoa.cpf ? mascararCpf(pessoa.cpf) : '—' }}</td>
          <td>{{ pessoa.telefone_principal || '—' }}</td>
          <td>{{ pessoa.data_nascimento ? (pessoa.data_nascimento | date: 'dd/MM/yyyy') : '—' }}</td>
          <td class="consulta__coluna-acao">
            <a mat-icon-button [routerLink]="['/pessoas', pessoa.id, 'editar']" aria-label="Editar pessoa">
              <mat-icon>edit</mat-icon>
            </a>
          </td>
        </tr>
      }
    </tbody>
  </table>
</app-pagina-consulta>
