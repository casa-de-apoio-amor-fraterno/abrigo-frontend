<app-pagina-consulta
  titulo="Quartos"
  subtitulo="Consulta de quartos e leitos cadastrados no Abrigo."
  [carregando]="carregando()"
  [erro]="erro()"
  [vazio]="itensFiltrados().length === 0"
  mensagemVazio="Nenhum quarto encontrado."
  [paginado]="false"
  [total]="itensFiltrados().length"
  rotuloItem="quarto(s)"
>
  <ng-container acoes>
    <button mat-button type="button" (click)="exportarCsv()">
      <mat-icon>download</mat-icon>
      Exportar CSV
    </button>
    <a mat-flat-button routerLink="/quartos/novo" class="consulta__nova-btn">
      <mat-icon>add</mat-icon>
      Novo quarto
    </a>
  </ng-container>

  <ng-container filtros>
    <input
      type="search"
      placeholder="Buscar por número, leito ou descrição..."
      [value]="termoBusca()"
      (input)="termoBusca.set($any($event.target).value)"
    />
    <mat-slide-toggle [checked]="mostrarInativos()" (change)="alternarMostrarInativos()">
      Mostrar inativos
    </mat-slide-toggle>
  </ng-container>

  <table class="consulta__tabela">
    <thead>
      <tr>
        <th>Número</th>
        <th>Leito(s)</th>
        <th>Descrição</th>
        <th>Status</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (quarto of itensFiltrados(); track quarto.id) {
        <tr [class.consulta__linha--inativa]="!quarto.ativo">
          <td>{{ quarto.numero }}</td>
          <td>{{ quarto.leito }}</td>
          <td>{{ quarto.descricao || '—' }}</td>
          <td>
            <span class="consulta__badge" [class.consulta__badge--neutro]="!quarto.ativo">
              {{ quarto.ativo ? 'Ativo' : 'Inativo' }}
            </span>
          </td>
          <td class="consulta__coluna-acao">
            <a mat-icon-button [routerLink]="['/quartos', quarto.id, 'editar']" aria-label="Editar quarto">
              <mat-icon>edit</mat-icon>
            </a>
          </td>
        </tr>
      }
    </tbody>
  </table>
</app-pagina-consulta>
